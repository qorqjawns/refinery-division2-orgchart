const pattern={A:['N','N','O','O','D','D','O','O','N','N','O','O','D','D','O','O'],B:['D','D','O','O','N','N','O','O','D','D','O','O','N','N','O','O'],C:['O','O','N','N','O','O','D','D','O','O','N','N','O','O','D','D'],D:['O','O','D','D','O','O','N','N','O','O','D','D','O','O','N','N']};
const lunar={"2020":{"seollal":"01-25","chuseok":"10-01","buddha":"04-30"},"2021":{"seollal":"02-12","chuseok":"09-21","buddha":"05-19"},"2022":{"seollal":"02-01","chuseok":"09-10","buddha":"05-08"},"2023":{"seollal":"01-22","chuseok":"09-29","buddha":"05-27"},"2024":{"seollal":"02-10","chuseok":"09-17","buddha":"05-15"},"2025":{"seollal":"01-29","chuseok":"10-06","buddha":"05-05"},"2026":{"seollal":"02-17","chuseok":"09-25","buddha":"05-24"},"2027":{"seollal":"02-07","chuseok":"09-15","buddha":"05-13"},"2028":{"seollal":"01-27","chuseok":"10-03","buddha":"05-02"},"2029":{"seollal":"02-13","chuseok":"09-22","buddha":"05-20"},"2030":{"seollal":"02-03","chuseok":"09-12","buddha":"05-09"},"2031":{"seollal":"01-23","chuseok":"10-01","buddha":"04-28"},"2032":{"seollal":"02-11","chuseok":"09-19","buddha":"05-16"},"2033":{"seollal":"01-31","chuseok":"09-08","buddha":"05-06"},"2034":{"seollal":"02-19","chuseok":"09-27","buddha":"05-25"},"2035":{"seollal":"02-08","chuseok":"09-16","buddha":"05-15"}};
const specialHolidays={
 '2020-04-15':'제21대 국회의원선거','2022-03-09':'제20대 대통령선거','2022-06-01':'지방선거','2024-04-10':'제22대 국회의원선거','2026-06-03':'지방선거','2027-03-03':'제21대 대통령선거','2028-04-12':'제23대 국회의원선거','2030-06-12':'지방선거','2032-04-14':'제24대 국회의원선거','2032-03-03':'제22대 대통령선거','2034-06-07':'지방선거'};
let state={weekStart:(()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})(),edit:false,overrides:{},leaves:[],subs:{}};
try{const saved=JSON.parse(localStorage.getItem(STORAGE)); if(saved) state={...state,...saved,weekStart:state.weekStart,edit:false};}catch(e){}
function save(){localStorage.setItem(STORAGE,JSON.stringify({weekStart:state.weekStart,overrides:state.overrides,leaves:state.leaves,subs:state.subs}));}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const off=(x.getDay()+6)%7;x.setDate(x.getDate()-off);return x}
function diffDays(a,b){return Math.round((a-b)/86400000)}
function codeFor(d){let i=((diffDays(d,baseDate)%16)+16)%16;return teamOrder.map(t=>pattern[t][i]).join('')}
function workTeams(d){let i=((diffDays(d,baseDate)%16)+16)%16;return {day:teamOrder.find(t=>pattern[t][i]==='D'),night:teamOrder.find(t=>pattern[t][i]==='N')};}
function addName(map,key,name){if(!map[key])map[key]=[];if(!map[key].includes(name))map[key].push(name)}
function holidayMap(year){
 const map={}; const fixed=[['01-01','신정',false],['03-01','삼일절',true],['05-05','어린이날',true],['06-06','현충일',false],['08-15','광복절',true],['10-03','개천절',true],['10-09','한글날',true],['12-25','성탄절',true]];
 const eligible=[];
 fixed.forEach(([md,name,sub])=>{const k=year+'-'+md;addName(map,k,name);if(sub)eligible.push({start:k,end:k,name:'대체공휴일'});});
 const lunarYear=lunar[year];
 if(lunarYear){
   const s=parseISO(year+'-'+lunarYear.seollal);[-1,0,1].forEach((n,idx)=>addName(map,iso(addDays(s,n)),idx===1?'설날':'설날 연휴'));
   eligible.push({start:iso(addDays(s,-1)),end:iso(addDays(s,1)),name:'대체공휴일'});
   const c=parseISO(year+'-'+lunarYear.chuseok);[-1,0,1].forEach((n,idx)=>addName(map,iso(addDays(c,n)),idx===1?'추석':'추석 연휴'));
   eligible.push({start:iso(addDays(c,-1)),end:iso(addDays(c,1)),name:'대체공휴일'});
   const b=year+'-'+lunarYear.buddha;addName(map,b,'부처님오신날');eligible.push({start:b,end:b,name:'대체공휴일'});
 }
 Object.entries(specialHolidays).forEach(([k,v])=>{if(k.startsWith(year+'-'))addName(map,k,v)});
 // 대체공휴일: 대상 기간이 토·일 또는 다른 공휴일과 겹칠 때, 다음 비공휴일을 대체일로 계산
 eligible.forEach(h=>{
   const st=parseISO(h.start), en=parseISO(h.end); let trigger=false;
   for(let x=new Date(st);x<=en;x=addDays(x,1)){if(x.getDay()===0||x.getDay()===6||(map[iso(x)]||[]).length>1){trigger=true;break;}}
   if(trigger){let q=addDays(en,1);while(q.getDay()===0||q.getDay()===6||map[iso(q)])q=addDays(q,1);addName(map,iso(q),h.name);}
 });
 return map;
}
function getHoliday(d){return holidayMap(d.getFullYear())[iso(d)]||[]}
function peopleForRole(role){const a=[];teamOrder.forEach(team=>{const p=roster[team]?.[role];if(p&&!p.vacancy)a.push({...p,id:team+'-'+role,team,role});});return a}
function allPeople(){return roles.flatMap(r=>peopleForRole(r.key)).concat(OFFICE_PEOPLE)}
function shiftPeople(){return roles.flatMap(r=>peopleForRole(r.key));}
function roleGroup(role){return role==='SF'?'S/F':(['HCR','HMU'].includes(role)?'Board':'Field');}
function personChoiceLabel(p){return `${p.name} · ${p.team}조 · ${roleGroup(p.role)}`;}
function bindPersonSearch(inputId,hiddenId,resultsId,people,emptyText){
 const input=document.getElementById(inputId),hidden=document.getElementById(hiddenId),results=document.getElementById(resultsId);
 if(!input||!hidden||!results)return;
 const container=input.closest('.person-search');
 function draw(){
  const q=input.value.trim().toLowerCase();
  const filtered=people.filter(p=>`${p.name} ${p.team} ${roleGroup(p.role)} ${p.role}`.toLowerCase().includes(q));
  if(!filtered.length){results.innerHTML=`<div class="person-search-empty">${emptyText||'조건에 맞는 인원이 없습니다.'}</div>`;results.classList.add('open');return;}
  results.innerHTML=filtered.map(p=>`<button type="button" class="person-search-option" data-person-id="${p.id}"><strong>${p.name}</strong><span>${p.team}조 · ${roleGroup(p.role)}</span></button>`).join('');
  results.classList.add('open');
  results.querySelectorAll('[data-person-id]').forEach(btn=>btn.onclick=()=>{
   const selected=people.find(p=>p.id===btn.dataset.personId);
   if(!selected)return;
   hidden.value=selected.id;
   input.value=personChoiceLabel(selected);
   results.innerHTML='';
   results.classList.remove('open');
  });
 }
 input.addEventListener('focus',draw);
 input.addEventListener('input',()=>{hidden.value='';draw();});
 input.addEventListener('keydown',e=>{if(e.key==='Escape')results.classList.remove('open');});
 if(container){document.addEventListener('pointerdown',e=>{if(!container.contains(e.target))results.classList.remove('open');});}
}
function personWorkingAt(personId,dateISO,shift,exceptKey=''){
 for(const item of roles){
  const key=slotKey(dateISO,shift,item.key);
  if(key===exceptKey)continue;
  const assigned=visiblePerson(parseISO(dateISO),shift,item.key);
  if(assigned&&assigned.id===personId&&!assigned.vacancy&&!assigned.onLeave)return true;
 }
 return false;
}
function replacementCandidates(ctx){
 const day=parseISO(ctx.date),previous=iso(addDays(day,-1)),next=iso(addDays(day,1)),targetKey=slotKey(ctx.date,ctx.shift,ctx.role);
 return shiftPeople().filter(p=>{
  if(ctx.absentPersonId&&p.id===ctx.absentPersonId)return false;
  if(ctx.shift==='day'){
   return !personWorkingAt(p.id,previous,'night')&&!personWorkingAt(p.id,ctx.date,'day',targetKey)&&!personWorkingAt(p.id,ctx.date,'night',targetKey);
  }
  return !personWorkingAt(p.id,ctx.date,'day',targetKey)&&!personWorkingAt(p.id,ctx.date,'night',targetKey)&&!personWorkingAt(p.id,next,'day');
 });
}

function findPerson(id){return allPeople().find(p=>p.id===id)}
function slotKey(dayISO,shift,role){return dayISO+'|'+shift+'|'+role}
function basePerson(d,shift,role){const t=workTeams(d)[shift];if(!t)return {name:'결원',vacancy:true,roleLabel:roles.find(r=>r.key===role).label};const p=roster[t]?.[role];return p?{...p,id:t+'-'+role,team:t,role}:{name:'결원',vacancy:true}}
function leaveFor(personId,dayISO){return state.leaves.find(x=>x.personId===personId&&x.start<=dayISO&&dayISO<=x.end)}
function visiblePerson(d,shift,role){const k=slotKey(iso(d),shift,role);let p=basePerson(d,shift,role);const override=state.overrides[k];if(override){const z=findPerson(override);if(z)p={...z,manual:true};}
 const leave=p.id?leaveFor(p.id,iso(d)):null; const sub=state.subs[k];
 if(sub){const z=findPerson(sub.personId);if(z)return {...z,subType:sub.type,absentName:sub.absentName,sourceLeave:true};}
 if(leave)return {...p,onLeave:true,leave};
 return p;
}
function initials(name){return (name||'결원').replace(/\s+/g,'').slice(0,2)}
function displayHeader(){const h=document.getElementById('dateHeader');h.innerHTML='<th class="corner">근무</th><th class="role-head">구분</th>';const start=parseISO(state.weekStart);const now=iso(new Date());for(let i=0;i<7;i++){const d=addDays(start,i), hol=getHoliday(d);let cls='date-head '+(d.getDay()===6?'sat ':'')+(d.getDay()===0?'sun ':'')+(hol.length?'holiday ':'');let code=codeFor(d);h.insertAdjacentHTML('beforeend',`<th class="${cls}" data-date="${iso(d)}" title="${hol.join(' · ')}"><div class="date-line"><span><span class="date-num">${d.getMonth()+1}.${d.getDate()}</span> <span class="dow">${dayNames[d.getDay()]}</span></span>${iso(d)===now?'<span class="today-mark">오늘</span>':''}</div><div class="shift-code">${[...code].map(c=>'<span class="code-box '+(c==='D'?'day':c==='N'?'night':'')+'">'+c+'</span>').join('')}</div>${hol.length?'<div class="holiday-label">'+hol.join(' · ')+'</div>':'<div class="blank-label"></div>'}</th>`);}}
function cardHTML(d,shift,role,compact){
 const p=visiblePerson(d,shift,role);
 const key=slotKey(iso(d),shift,role);
 const classes=['card'];
 if(compact)classes.push('compact');
 if(p.vacancy)classes.push('vacancy');
 if(p.onLeave)classes.push('on-leave');
 const badges=p.subType?`<span class="badge sub">${p.subType}</span>`:p.onLeave?'<span class="badge leave">휴가</span>':'';
 const roleTag={HCR:'HCR',HMU:'#1HMU',CF:'C/F',F1:"F1 (RX')",F2:"F2 (FRAC')",F3:'F3 (HMU)'}[role]||'';
 const tag=compact?`<span class="slot-role">${roleTag}</span>`:'';
 const avatar=p.vacancy?'<span class="vacancy-dot" aria-hidden="true"></span>':(p.photo?`<img class="avatar" alt="" src="${p.photo}">`:`<span class="avatar initial">${initials(p.name)}</span>`);
 const label=p.vacancy?'결원':p.name;
 return `<div class="${classes.join(' ')}" draggable="${state.edit&&!p.onLeave&&!p.vacancy?'true':'false'}" data-key="${key}" data-role="${role}" data-person="${p.id||''}" data-date="${iso(d)}" data-shift="${shift}">${avatar}<span class="person-name">${label}</span>${tag}${badges}</div>`;
}
function groupRowHTML(d,shift,row){const cards=row.roles.map(r=>cardHTML(d,shift,r,row.kind!=='sf')).join('');return `<td class="slot-cell" data-date="${iso(d)}"><div class="slot-grid ${row.kind}">${cards}</div></td>`}

function officeCardHTML(p){const avatar=p.photo?`<img class="avatar" alt="" src="${p.photo}">`:`<span class="avatar initial">${initials(p.name)}</span>`;return `<div class="card office-card" data-office-id="${p.id}" data-person="${p.id}">${avatar}<span style="min-width:0;display:flex;flex-direction:column;gap:2px"><span class="person-name">${p.name}</span><span class="office-role">${p.position}</span></span></div>`}
function renderOffice(){const el=document.getElementById('officeGrid');if(!el)return;el.innerHTML=OFFICE_PEOPLE.map(officeCardHTML).join('');el.querySelectorAll('.office-card').forEach(c=>c.addEventListener('click',()=>openPersonInfo(findPerson(c.dataset.person))));}
function openPersonInfo(p){
  if(!p)return;
  const avatar=p.photo?`<img class="profile-avatar" src="${p.photo}" alt="">`:`<div class="profile-avatar profile-initial">${initials(p.name)}</div>`;
  const team=p.team?`${p.team}${p.team==='주간 사무실'?'':'조'}`:'-';
  const job=p.position || (p.role==='SF'?'S/F':['HCR','HMU'].includes(p.role)?'Board':['CF','F1','F2','F3'].includes(p.role)?'Field':'-');
  const mobile=p.mobile || (p.extension&&/^\d{4}-\d{4}$/.test(p.extension)?`010-${p.extension}`:p.extension) || '미등록';
  modal(`<div class="modal"><div class="modal-header"><div class="modal-title">인원 정보</div><div class="modal-subtitle">근무 편성 기준 정보</div></div><div class="modal-body"><div class="person-profile">${avatar}<div class="profile-meta"><div class="profile-name">${p.name}</div><div class="profile-row">소속: ${team}</div><div class="profile-row">직무: ${job}</div><div class="profile-row">사번: ${p.employeeNo||'미등록'}</div><div class="profile-row">핸드폰 번호: ${mobile}</div></div></div><div class="modal-actions"><button class="btn primary" id="closeInfo">닫기</button></div></div></div>`);
  document.getElementById('closeInfo').onclick=closeModal;
}

function render(){state.weekStart=iso(mondayOf(parseISO(state.weekStart)));document.getElementById('weekDate').value=state.weekStart;document.getElementById('app').classList.toggle('edit-mode',state.edit);document.getElementById('editBtn').textContent=state.edit?'수정 완료':'수정 시작';document.getElementById('editBtn').classList.toggle('edit-active',state.edit);document.getElementById('normalHint').classList.toggle('hidden',state.edit);displayHeader();const body=document.getElementById('scheduleBody');body.innerHTML='';const start=parseISO(state.weekStart);[['day','주간근무','07:00 ~ 19:00'],['night','야간근무','19:00 ~ 07:00']].forEach(([shift,label,time])=>{compactRows.forEach((row,idx)=>{const tr=document.createElement('tr');tr.className='row-'+row.kind+' '+(idx===0?(shift==='day'?'day-start':'night-start'):'');if(idx===0)tr.innerHTML+=`<th class="shift-block ${shift}-shift" rowspan="3"><div class="shift-inner"><span class="shift-name">${label}</span><span class="shift-time">${time}</span></div></th>`;tr.innerHTML+=`<th class="role-label"><div class="role-name">${row.label}</div><div class="role-count">${row.count}</div></th>`;for(let i=0;i<7;i++)tr.innerHTML+=groupRowHTML(addDays(start,i),shift,row);body.appendChild(tr);});});bindCards();renderOffice();}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
function bindCards(){document.querySelectorAll('.card').forEach(el=>{el.addEventListener('click',()=>onCardClick(el));el.addEventListener('dragstart',e=>{if(!state.edit)return;e.dataTransfer.setData('text/plain',el.dataset.key);el.classList.add('dragging')});el.addEventListener('dragend',()=>el.classList.remove('dragging'));el.addEventListener('dragover',e=>{if(state.edit)e.preventDefault()});el.addEventListener('dragenter',e=>{if(state.edit){e.preventDefault();el.classList.add('drop-target')}});el.addEventListener('dragleave',()=>el.classList.remove('drop-target'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drop-target');if(!state.edit)return;const from=e.dataTransfer.getData('text/plain');if(from&&from!==el.dataset.key)swapSlots(from,el.dataset.key)})})}
function onCardClick(el){
 const d=parseISO(el.dataset.date),role=el.dataset.role,shift=el.dataset.shift;
 const p=visiblePerson(d,shift,role);
 if(p.onLeave){openReplacement({date:el.dataset.date,shift,role,type:'휴가 대근',absentName:p.name,absentPersonId:p.id});return;}
 if(p.vacancy){openReplacement({date:el.dataset.date,shift,role,type:'결원 대근',absentName:'결원',absentPersonId:''});return;}
 if(state.edit){openChange(el.dataset.key,role,p);return;}
 openPersonInfo(p);
}
function swapSlots(a,b){const A=a.split('|'),B=b.split('|');const pa=visiblePerson(parseISO(A[0]),A[1],A[2]),pb=visiblePerson(parseISO(B[0]),B[1],B[2]);if(pa.onLeave||pb.onLeave||pa.vacancy||pb.vacancy){toast('휴가·결원 카드는 클릭하여 대근자를 등록해 주세요.');return}state.overrides[a]=pb.id;state.overrides[b]=pa.id;save();render();toast('근무자를 교체했습니다.');}
function modal(html){const root=document.getElementById('modalRoot');root.className='';root.innerHTML='<div class="modal-backdrop" id="backdrop">'+html+'</div>';root.querySelector('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()});}
function closeModal(){const r=document.getElementById('modalRoot');r.className='hidden';r.innerHTML=''}
function personOptions(role,selected=''){return peopleForRole(role).map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${p.name} · ${p.team}조</option>`).join('')}
function allShiftPersonOptions(selected=''){return roles.flatMap(r=>peopleForRole(r.key)).map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${p.name} · ${p.team}조 · ${p.roleLabel||p.role}</option>`).join('')}
function openReplacement(ctx){
 const roleName=roles.find(r=>r.key===ctx.role).label;
 const candidates=replacementCandidates(ctx);
 const hasCandidates=candidates.length>0;
 modal(`<div class="modal replacement-modal"><div class="modal-header"><div class="modal-title">${ctx.type} 등록</div><div class="modal-subtitle">${ctx.date} · ${ctx.shift==='day'?'주간':'야간'} · ${roleName} · ${ctx.absentName}</div></div><div class="modal-body"><label class="form-label">대근자 선택</label><div class="person-search"><input id="subSearch" class="form-control" type="text" autocomplete="off" placeholder="이름 또는 조를 입력하세요"><input id="subPerson" type="hidden"><div id="subResults" class="person-search-results"></div></div><div class="modal-note">${hasCandidates?'직무와 조 구분 없이 교대조 인원을 검색해 선택할 수 있습니다.':'연속 근무 제한으로 현재 선택 가능한 교대조 인원이 없습니다.'}</div><div class="modal-actions"><button class="btn" id="cancelModal">취소</button><button class="btn primary" id="saveSub" ${hasCandidates?'':'disabled'}>대근 반영</button></div></div></div>`);
 document.getElementById('cancelModal').onclick=closeModal;
 if(hasCandidates){
  bindPersonSearch('subSearch','subPerson','subResults',candidates,'조건에 맞는 대근자가 없습니다.');
  setTimeout(()=>{const input=document.getElementById('subSearch');if(input)input.focus();},0);
 }
 document.getElementById('saveSub').onclick=()=>{
  const personId=document.getElementById('subPerson').value;
  if(!personId){toast('대근자를 선택해 주세요.');return;}
  const key=slotKey(ctx.date,ctx.shift,ctx.role);
  state.subs[key]={personId,type:ctx.type,absentName:ctx.absentName};
  save();closeModal();render();toast(ctx.type+'을 반영했습니다.');
 };
}
function openChange(key,role,current){modal(`<div class="modal"><div class="modal-header"><div class="modal-title">근무자 변경</div><div class="modal-subtitle">교대근무 인원 전체 중에서 변경할 수 있습니다.</div></div><div class="modal-body"><label class="form-label">변경할 직원</label><select id="changePerson" class="form-control">${allShiftPersonOptions(current.id)}</select><div class="modal-note">수정 모드에서는 업무 구분과 관계없이 모든 근무 카드끼리 드래그 교체할 수 있습니다.</div><div class="modal-actions"><button class="btn danger" id="clearChange">기본 편성 복원</button><button class="btn" id="cancelModal">취소</button><button class="btn primary" id="saveChange">변경 반영</button></div></div></div>`);document.getElementById('cancelModal').onclick=closeModal;document.getElementById('clearChange').onclick=()=>{delete state.overrides[key];save();closeModal();render();toast('기본 편성으로 복원했습니다.');};document.getElementById('saveChange').onclick=()=>{state.overrides[key]=document.getElementById('changePerson').value;save();closeModal();render();toast('근무자를 변경했습니다.');}}
function openLeave(){
 const people=shiftPeople();
 const list=state.leaves.length?state.leaves.map((x,i)=>{const p=findPerson(x.personId);return `<div class="leave-item"><span>${p?p.name:'등록 인원'} · ${x.start.replaceAll('-','.') } ~ ${x.end.replaceAll('-','.')}</span><button data-remove-leave="${i}">삭제</button></div>`}).join(''):'<div class="modal-note">등록된 휴가가 없습니다.</div>';
 modal(`<div class="modal leave-picker-modal"><div class="modal-header"><div class="modal-title">휴가 입력</div><div class="modal-subtitle">교대근무자만 휴가를 등록할 수 있습니다.</div></div><div class="modal-body"><label class="form-label">휴가자</label><div class="person-search"><input id="leaveSearch" class="form-control" type="text" autocomplete="off" placeholder="이름 또는 조를 입력하세요"><input id="leavePerson" type="hidden"><div id="leaveResults" class="person-search-results"></div></div><div class="form-grid"><div><label class="form-label">시작일</label><input id="leaveStart" class="form-control" type="date" value="${iso(addDays(new Date(),1))}"></div><div><label class="form-label">종료일</label><input id="leaveEnd" class="form-control" type="date" value="${iso(addDays(new Date(),1))}"></div></div><div class="modal-actions"><button class="btn" id="cancelModal">취소</button><button class="btn primary" id="saveLeave">휴가 반영</button></div><div class="leave-list">${list}</div></div></div>`);
 document.getElementById('cancelModal').onclick=closeModal;
 bindPersonSearch('leaveSearch','leavePerson','leaveResults',people,'조건에 맞는 교대근무자가 없습니다.');
 document.querySelectorAll('[data-remove-leave]').forEach(b=>b.onclick=()=>{state.leaves.splice(Number(b.dataset.removeLeave),1);save();openLeave();render();});
 document.getElementById('saveLeave').onclick=()=>{
  const personId=document.getElementById('leavePerson').value,s=document.getElementById('leaveStart').value,e=document.getElementById('leaveEnd').value;
  if(!personId||!s||!e){toast('휴가자와 기간을 입력해 주세요.');return;}
  if(s>e){toast('종료일은 시작일 이후여야 합니다.');return;}
  state.leaves.push({personId,start:s,end:e});save();closeModal();render();toast('휴가를 반영했습니다.');
 };
}
// XLSX ZIP parser: 업로드한 조직도에서 조별 이름 및 사진을 다시 읽습니다.
async function unzipXlsx(file){const b=new Uint8Array(await file.arrayBuffer());let eocd=-1;for(let i=b.length-22;i>=Math.max(0,b.length-66000);i--){if(b[i]===0x50&&b[i+1]===0x4b&&b[i+2]===0x05&&b[i+3]===0x06){eocd=i;break}}if(eocd<0)throw new Error('ZIP 형식을 읽을 수 없습니다.');const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);const count=dv.getUint16(eocd+10,true), cdOff=dv.getUint32(eocd+16,true);let p=cdOff, files={};for(let i=0;i<count;i++){if(dv.getUint32(p,true)!==0x02014b50)break;const method=dv.getUint16(p+10,true),comp=dv.getUint32(p+20,true),nameLen=dv.getUint16(p+28,true),extraLen=dv.getUint16(p+30,true),commentLen=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);const name=new TextDecoder().decode(b.slice(p+46,p+46+nameLen));const lName=dv.getUint16(off+26,true),lExtra=dv.getUint16(off+28,true),data=b.slice(off+30+lName+lExtra,off+30+lName+lExtra+comp);let out;if(method===0)out=data;else if(method===8){out=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}else throw new Error('지원하지 않는 XLSX 압축 방식입니다.');files[name]=out;p+=46+nameLen+extraLen+commentLen;}return files}
function xml(bytes){return new DOMParser().parseFromString(new TextDecoder().decode(bytes),'application/xml')}
function relMap(doc){const map={};doc.querySelectorAll('Relationship').forEach(r=>map[r.getAttribute('Id')]=r.getAttribute('Target'));return map}
function normalizePath(base,target){const parts=(base+'/'+target).split('/'),out=[];for(const x of parts){if(!x||x==='.')continue;if(x==='..')out.pop();else out.push(x)}return out.join('/')}
function cellCol(ref){const m=ref.match(/[A-Z]+/)[0];let n=0;for(const c of m)n=n*26+c.charCodeAt(0)-64;return n}
async function applyOrganizationXlsx(file){
 const z=await unzipXlsx(file);
 const wb=xml(z['xl/workbook.xml']);
 const wr=relMap(xml(z['xl/_rels/workbook.xml.rels']));
 let sheetNode=[...wb.querySelectorAll('sheet')].find(s=>s.getAttribute('name').includes('09월')||s.getAttribute('name').includes('조직도'))||wb.querySelector('sheet');
 const rid=sheetNode.getAttribute('r:id');
 let target=wr[rid];
 if(!target)throw new Error('조직도 시트를 찾지 못했습니다.');
 const sheetPath=normalizePath('xl',target);
 const sh=xml(z[sheetPath]);
 let strings=[];
 if(z['xl/sharedStrings.xml']){const ss=xml(z['xl/sharedStrings.xml']);strings=[...ss.querySelectorAll('si')].map(x=>x.textContent);}
 const cellVals={};
 sh.querySelectorAll('c').forEach(c=>{let v=c.querySelector('v')?.textContent||c.querySelector('t')?.textContent||'';if(c.getAttribute('t')==='s')v=strings[Number(v)]||'';cellVals[c.getAttribute('r')]=v.trim();});
 const sheetRelsPath=sheetPath.substring(0,sheetPath.lastIndexOf('/')+1)+'_rels/'+sheetPath.substring(sheetPath.lastIndexOf('/')+1)+'.rels';
 let drawingTarget;
 if(z[sheetRelsPath]){
  const sr=relMap(xml(z[sheetRelsPath]));
  const drawing=sh.querySelector('drawing');
  if(drawingTarget=sr[drawing?.getAttribute('r:id')])drawingTarget=normalizePath(sheetPath.substring(0,sheetPath.lastIndexOf('/')),drawingTarget);
 }
 const photoAnchorToNameCol={4:2,6:5,9:8,13:11,15:14};
 const imageAt={};
 if(drawingTarget&&z[drawingTarget]){
  const dr=xml(z[drawingTarget]);
  const relPath=drawingTarget.substring(0,drawingTarget.lastIndexOf('/')+1)+'_rels/'+drawingTarget.substring(drawingTarget.lastIndexOf('/')+1)+'.rels';
  const drrels=z[relPath]?relMap(xml(z[relPath])):{};
  dr.querySelectorAll('twoCellAnchor,oneCellAnchor').forEach(a=>{
   const from=a.querySelector('from');
   const anchorCol=Number(from?.querySelector('col')?.textContent)+1;
   const row=Number(from?.querySelector('row')?.textContent)+1;
   const blip=a.querySelector('blip');
   const embed=blip?.getAttribute('r:embed');
   const mediaTarget=drrels[embed];
   const path=mediaTarget?normalizePath(drawingTarget.substring(0,drawingTarget.lastIndexOf('/')),mediaTarget):'';
   if(path&&z[path]){
    const ext=(path.split('.').pop()||'png').replace('jpg','jpeg');
    const nameCol=photoAnchorToNameCol[anchorCol];
    if(nameCol)imageAt[`${nameCol}:${row}`]=URL.createObjectURL(new Blob([z[path]],{type:'image/'+ext}));
   }
  });
 }
 const cell=(col,row)=>cellVals[String.fromCharCode(64+col)+row]||'';
 const compact=v=>String(v||'').replace(/\s+/g,' ').trim();
 const phone=v=>{const d=compact(v).replace(/\D/g,'');return d.length===8?`010-${d.slice(0,4)}-${d.slice(4)}`:compact(v);};
 const kind=role=>role==='SF'?'S/F':(['HCR','HMU'].includes(role)?'Board':'Field');
 const next={};
 const cols={A:5,B:8,C:11,D:14};
 const rmap={SF:9,HCR:12,HMU:15,CF:18,F1:21,F2:24,F3:27};
 for(const [team,col] of Object.entries(cols)){
  next[team]={};
  for(const [role,row] of Object.entries(rmap)){
   const name=compact(cell(col,row));
   const vacancy=!name||name==='결원';
   next[team][role]={name:vacancy?'결원':name,photo:vacancy?'':(imageAt[`${col}:${row}`]||''),vacancy,roleLabel:kind(role),position:kind(role),employeeNo:vacancy?'':compact(cell(col,row+1)),mobile:vacancy?'':phone(cell(col,row+2))};
  }
 }
 const officeCols=[
  ['office-팀장',2,'박병천 책임매니저','책임매니저'],
  ['office-보직과장',5,'백범준 책임매니저','책임매니저'],
  ['office-G/F',8,'','G/F'],
  ['office-주간/F',11,'','주간/F'],
  ['office-주간근무',14,'','주간근무']
 ];
 OFFICE_PEOPLE=officeCols.map(([id,col,forcedName,position])=>({id,name:forcedName||compact(cell(col,4)),position,team:'주간 사무실',role:'OFFICE',employeeNo:compact(cell(col,5)),mobile:phone(cell(col,6)),photo:imageAt[`${col}:4`]||''}));
 roster=next;
 document.getElementById('orgDate').textContent='조직도 업로드 반영됨: '+file.name;
 render();
 toast('조직도 이름·사진·인원 정보를 정확한 위치 기준으로 반영했습니다.');
}

document.getElementById('prevWeek').onclick=()=>{state.weekStart=iso(addDays(parseISO(state.weekStart),-7));render()};document.getElementById('nextWeek').onclick=()=>{state.weekStart=iso(addDays(parseISO(state.weekStart),7));render()};document.getElementById('todayBtn').onclick=()=>{state.weekStart=iso(mondayOf(new Date()));render()};document.getElementById('weekDate').onchange=e=>{if(e.target.value){state.weekStart=iso(mondayOf(parseISO(e.target.value)));render()}};document.getElementById('editBtn').onclick=()=>{state.edit=!state.edit;render();toast(state.edit?'수정 모드를 시작했습니다.':'수정 모드를 종료했습니다.')};document.getElementById('leaveBtn').onclick=openLeave;document.getElementById('printBtn').onclick=()=>window.print();document.getElementById('resetBtn').onclick=()=>{modal(`<div class="modal"><div class="modal-header"><div class="modal-title">수정 초기화</div><div class="modal-subtitle">초기화하려면 비밀번호를 입력하세요.</div></div><div class="modal-body"><label class="form-label">비밀번호</label><input id="resetPassword" class="form-control" type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호 입력"><div class="modal-actions"><button class="btn" id="cancelModal">취소</button><button class="btn danger" id="confirmReset">초기화</button></div></div></div>`);document.getElementById('cancelModal').onclick=closeModal;document.getElementById('confirmReset').onclick=()=>{if(document.getElementById('resetPassword').value!=='1900'){toast('비밀번호가 올바르지 않습니다.');return;}state.overrides={};state.leaves=[];state.subs={};save();closeModal();render();toast('수정 내용을 초기화했습니다.');};document.getElementById('resetPassword').focus();};document.getElementById('orgBtn').onclick=()=>document.getElementById('orgFile').click();document.getElementById('orgFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{toast('조직도를 읽는 중입니다.');await applyOrganizationXlsx(f)}catch(err){console.error(err);toast('조직도 반영에 실패했습니다. 기존 자료를 유지합니다.')}finally{e.target.value=''}};render();
</script>

<script>
(function () {
  function fixCandidateLists() {
    var nodes = document.querySelectorAll('[class*="candidate"], [class*="replacement"], [class*="search-result"], [id*="candidate"], [id*="replacement"], [id*="substitute"]');
    nodes.forEach(function (el) {
      var text = (el.innerText || '').trim();
      if (text && el.scrollHeight > 80) {
        el.style.setProperty('height', 'min(48vh, 430px)', 'important');
        el.style.setProperty('max-height', 'min(48vh, 430px)', 'important');
        el.style.setProperty('overflow-y', 'auto', 'important');
        el.style.setProperty('overflow-x', 'hidden', 'important');
      }
    });
  }
  document.addEventListener('DOMContentLoaded', fixCandidateLists);
  document.addEventListener('click', function () { setTimeout(fixCandidateLists, 50); });
  var observer = new MutationObserver(function () { fixCandidateLists(); });
  observer.observe(document.documentElement, { childList: true, subtree: true });
}());
</script>

<script id="current-week-and-header-only">
(function () {
  function isoDate(date) {
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
  }
  function mondayOf(date) {
    var value = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    value.setDate(value.getDate() - ((value.getDay() + 6) % 7));
    return value;
  }
  function markTodayHeader() {
    document.querySelectorAll('th.date-head.today-date-header').forEach(function (node) {
      node.classList.remove('today-date-header');
    });
    var today = isoDate(new Date());
    var header = document.querySelector('th.date-head[data-date="' + today + '"]');
    if (header) header.classList.add('today-date-header');
  }
  function showCurrentWeek() {
    if (typeof state !== 'undefined' && typeof render === 'function') {
      state.weekStart = isoDate(mondayOf(new Date()));
      render();
    }
    markTodayHeader();
    requestAnimationFrame(markTodayHeader);
  }
  showCurrentWeek();
  window.addEventListener('load', showCurrentWeek, { once: true });
}());
</script>
